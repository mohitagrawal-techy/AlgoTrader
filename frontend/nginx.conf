server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS, re-read often so a restarted backend is found at its new address.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        # A refresh can wait on the AI review, which is limited to 180 seconds.
        proxy_read_timeout 300s;
        # Matches the backend's limit for the industry list upload.
        client_max_body_size 2m;
        # AI answers are sent as they are written.
        proxy_buffering off;
    }

    location /auth/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
