[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algoverse"
version = "0.1.0"
description = "Personal AI-assisted options research and paper trading platform"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "boto3>=1.34",
    "defusedxml>=0.7",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "protobuf>=7.35.1",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6",
    "scipy>=1.12",
    "tzdata>=2024.1",
    "uvicorn>=0.29",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.4"]

[project.scripts]
algoverse = "algoverse.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["backend/algoverse/brokers/proto"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
